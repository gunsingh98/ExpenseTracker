# This machine sits behind a TLS-intercepting corporate proxy. The JVM's bundled
# cacerts does not trust the proxy CA (while the OS/curl does), which breaks all
# JVM HTTPS downloads (Gradle distribution, Maven Central, foojay toolchains).
# Using the Windows root certificate store makes the JVM trust whatever Windows
# trusts, including the proxy CA. (Harmless/ignored on non-Windows CI hosts.)
org.gradle.jvmargs=-Djavax.net.ssl.trustStoreType=Windows-ROOT -Xmx1g

# Build the SPA + enable extra tasks only when explicitly requested.
org.gradle.caching=true

# Java 25 toolchain is installed locally; the corporate proxy blocks the JDK
# auto-provisioning CDNs, so we point Gradle at the local install and disable
# auto-download. (Cloud/CI without the proxy can flip auto-download back on.)
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C:\\GunS\\Setup\\zulu25.28.85-ca-jdk25.0.0-win_x64
