spring:
  application:
    name: expense-tracker
  # Performance: virtual threads for Tomcat request handling, so blocking I/O
  # (export rendering, Drive backup upload) scales without a thread-pool bottleneck.
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    problemdetails:
      enabled: true

server:
  address: 127.0.0.1
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  forward-headers-strategy: framework
  # Direct TLS. Off by default: production typically terminates TLS at a proxy
  # (hence forward-headers-strategy above). Enable this to have the app serve
  # HTTPS itself — set SSL_ENABLED=true and point SSL_KEYSTORE at a PKCS12
  # keystore. When on, the server serves HTTPS on ${PORT} (set PORT=8443).
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: ${SSL_KEYSTORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:}
  error:
    # Never leak exception messages or stack traces to clients.
    include-message: never
    include-stacktrace: never

security:
  jwt:
    # Base64-encoded, >=256-bit HMAC secret. REQUIRED in production (any non-dev
    # profile): startup fails if blank. In a dev/test profile an ephemeral key is
    # generated with a warning.
    secret-key: ${SECURITY_JWT_SECRET_KEY:}
    # Access-token lifetime in milliseconds (default 1 hour).
    expiration-time: ${SECURITY_JWT_EXPIRATION_TIME:3600000}
    # Refresh-token lifetime in milliseconds (default 30 days). Held in an
    # HttpOnly cookie and rotated on every /api/refresh call.
    refresh-expiration-time: ${SECURITY_JWT_REFRESH_EXPIRATION_TIME:2592000000}
    # Set the Secure flag on the refresh cookie. Keep true in production (HTTPS);
    # set REFRESH_COOKIE_SECURE=false only if testing over plain http.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}

app:
  # --- Primary data store (single SQLite DB: financial data + audit log) ---
  data:
    db-path: ${DATA_DB_PATH:data/tracker.db}

  # --- Offsite backup: a periodic Excel export pushed to Google Drive ---
  # Only active when app.drive.file-id is set; local-only runs skip backup.
  drive:
    file-id: ${DRIVE_FILE_ID:}
    credentials-json: ${GOOGLE_CREDENTIALS_JSON:}
    credentials-path: ${GOOGLE_CREDENTIALS_PATH:}
  backup:
    # Cron for the backup upload (default 03:00 daily).
    cron: ${BACKUP_CRON:0 0 3 * * *}

  # --- Login accounts (user + spouse). BCrypt hashes, supplied via env in production. ---
  users:
    - username: ${USER1_NAME:}
      password-hash: ${USER1_HASH:}
    - username: ${USER2_NAME:}
      password-hash: ${USER2_HASH:}

logging:
  level:
    com.expensetracker: INFO
